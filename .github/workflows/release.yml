name: Release

# Push a tag like `v0.2.0` to build `adarsh` for Windows, macOS and Linux
# and attach the binaries to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, exe: adarsh.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, exe: adarsh }
          - { os: macos-13, target: x86_64-apple-darwin, exe: adarsh }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, exe: adarsh }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: adarsh-rs
        run: cargo build --release --bin adarsh --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="adarsh-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "adarsh-rs/target/${{ matrix.target }}/release/${{ matrix.exe }}" "$name/"
          cp README.md "$name/"
          cp -r examples "$name/"
          if [[ "${{ matrix.os }}" == windows-* ]]; then
            7z a "$name.zip" "$name" > /dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
