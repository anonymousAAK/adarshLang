[package]
name = "adarshlang"
version = "0.3.0"
description = "AdarshLang: a Hinglish programming language"
edition = "2021"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = { version = "19", default-features = false, features = ["with-file-history"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "adarsh"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
